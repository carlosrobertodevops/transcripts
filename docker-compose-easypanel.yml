services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    shm_size: 256mb
    mem_limit: 768m
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=192MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.easypanel
      target: migrate
      args:
        PORT: "3001"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      NODE_ENV: production
    command:
      [
        "sh",
        "-lc",
        "bun run db:migrate && (bun run src/db/seed.ts || true)",
      ]

  app:
    build:
      context: .
      dockerfile: Dockerfile.easypanel
      args:
        PORT: "3001"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY required}
      TRANSCRIPTION_PROVIDER: "${TRANSCRIPTION_PROVIDER:-local}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      TRANSCRIBER_URL: "http://transcriber:8000"
      TRANSCRIPTION_PROVIDER_FALLBACK: "${TRANSCRIPTION_PROVIDER_FALLBACK:-}"
      TRANSCRIBER_TIMEOUT_MS: "${TRANSCRIBER_TIMEOUT_MS:-90000}"
      STORAGE_DIR: "/app/uploads"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3001}"
      NODE_ENV: production
    mem_limit: 1024m
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  transcriber:
    build:
      context: ./transcriber
      args:
        WHISPER_MODEL: tiny
        PRE_BAKE_MODEL: "true"
    restart: unless-stopped
    environment:
      LOG_LEVEL: INFO
      WHISPER_MODEL: tiny
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: "3"
      WHISPER_BEAM_SIZE: "1"
      WHISPER_NUM_WORKERS: "1"
      WHISPER_VAD_FILTER: "true"
      OMP_NUM_THREADS: "3"
    mem_limit: 1500m
    tmpfs:
      - /tmp:size=512m
    expose:
      - "8000"
    volumes:
      - transcriber_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.easypanel
      args:
        PORT: "3001"
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_healthy
      transcriber:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY required}
      APP_URL: "http://app:3001"
      NEXT_PUBLIC_APP_URL: "http://app:3001"
      TRANSCRIPTION_PROVIDER: "${TRANSCRIPTION_PROVIDER:-local}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      STORAGE_DIR: "/app/uploads"
      TRANSCRIBER_URL: "http://transcriber:8000"
      TRANSCRIPTION_PROVIDER_FALLBACK: "${TRANSCRIPTION_PROVIDER_FALLBACK:-}"
      TRANSCRIBER_TIMEOUT_MS: "${TRANSCRIBER_TIMEOUT_MS:-90000}"
      WORKER_INTERVAL_MS: "3000"
      NODE_ENV: production
    mem_limit: 512m
    volumes:
      - uploads:/app/uploads
    command: ["bun", "run", "worker:loop"]

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["debug"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD required}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    mem_limit: 256m
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  db_data:
  uploads:
  pgadmin_data:
  transcriber_cache:
