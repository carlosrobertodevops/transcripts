name: Deploy (Oracle Cloud Ampere A1 — reusable)
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      env:
        type: string
        required: false
        default: prod

concurrency:
  group: deploy-oci-vm-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to OCI Ampere A1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH compose pull + up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /srv/transcripts
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin
            export TAG="${{ inputs.tag }}"
            docker compose -f docker-compose-easypanel.yml pull
            docker compose -f docker-compose-easypanel.yml up -d --remove-orphans
            docker image prune -f
