version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
      radix:
        patterns: ["@radix-ui/*"]
      tiptap:
        patterns: ["@tiptap/*"]

  - package-ecosystem: pip
    directory: "/transcriber"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-transcriber)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
  - package-ecosystem: docker
    directory: "/transcriber"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker-transcriber)"
